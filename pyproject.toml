[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clm-sync"
version = "0.1.0"
description = "Sync VS Code chatLanguageModels.json model lists from OpenAI-compatible endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["vscode", "copilot", "chat", "language-models", "openai", "sync"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
clm-sync = "clm_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
